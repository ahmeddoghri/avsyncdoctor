[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "avsyncdoctor"
version = "0.1.0"
description = "Audio-video offset and drift repair tool"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Doghri"}]
dependencies = ["opencv-python-headless>=4.10"]

[project.scripts]
avsyncdoctor = "avsyncdoctor.cli:main"

[tool.setuptools]
packages = ["avsyncdoctor"]

[tool.setuptools.package-data]
avsyncdoctor = ["web/*.html"]
